services:
  acta:
    build: .
    ports:
      - "5487:5487"
    volumes:
      - ./reports:/app/reports
    environment:
      - ACTA_PORT=5487
      - ACTA_DATA_DIR=/app/reports
      - ACTA_WEB_DIR=/app/web
      - ACTA_JWT_SECRET=${ACTA_JWT_SECRET:-change-me-in-production}
      - ACTA_ADMIN_USER=${ACTA_ADMIN_USER:-}
      - ACTA_ADMIN_PASS=${ACTA_ADMIN_PASS:-}
      - ACTA_SERVER_URL=${ACTA_SERVER_URL:-}
    restart: always
