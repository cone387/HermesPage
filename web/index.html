<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Acta</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#content">跳转到报告</a>
    <header class="header">
        <h1 class="logo"><a href="/">Acta</a></h1>
        <div class="header-right">
            <div class="search-box">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
                <input type="search" id="search" class="search-input" placeholder="搜索报告…" aria-label="搜索报告">
                <kbd aria-hidden="true">/</kbd>
            </div>
            <button id="upload-btn" class="header-btn upload-button" style="display:none" title="上传报告" aria-label="上传报告">+</button>
            <button id="theme-toggle" class="header-btn" title="切换主题" aria-label="切换主题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1 9 9 0 1 0 20.9 13.3Z"/></svg></button>
            <div id="user-menu" class="user-menu" style="display:none">
                <button class="user-menu-trigger" id="user-menu-trigger" aria-expanded="false" aria-controls="user-dropdown"></button>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="/settings.html" class="dropdown-item">设置</a>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item dropdown-item-danger" id="logout-btn">退出登录</button>
                </div>
            </div>
            <span id="user-info" class="user-info"></span>
        </div>
    </header>
    <nav id="filters" class="filters" aria-label="报告筛选">
        <div class="filters-inner">
            <div class="filter-row category-row">
                <span class="filter-label">分类</span>
                <div id="category-buttons" class="filter-buttons"><button class="cat-btn active" data-cat="">全部</button></div>
                <label class="sort-control"><span class="sr-only">报告排序</span><select id="sort-select" class="sort-select">
                    <option value="time-desc">最新优先</option><option value="time-asc">最早优先</option>
                    <option value="title-asc">标题 A-Z</option><option value="title-desc">标题 Z-A</option>
                    <option value="size-desc">最大优先</option><option value="size-asc">最小优先</option>
                </select></label>
            </div>
            <div class="filter-row tag-row">
                <span class="filter-label">标签</span>
                <div id="tag-buttons" class="filter-buttons"><button class="tag-btn active" data-tag="">全部</button></div>
            </div>
            <div class="filter-row" id="owner-filter-row" style="display:none">
                <span class="filter-label">用户</span><div id="owner-buttons" class="filter-buttons"></div>
            </div>
        </div>
    </nav>
    <main class="main-panel">
        <div class="results-bar"><p id="result-count" role="status" aria-live="polite">正在读取报告…</p><button id="clear-filters" class="text-button" hidden>清除筛选</button></div>
        <div id="content" class="content" tabindex="-1"><div class="loading">正在加载报告…</div></div>
        <div id="empty" class="empty" style="display:none">
            <div class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4Z M8 9h8 M8 13h5"/></svg></div>
            <h2 id="empty-title">暂无报告</h2><p id="empty-description">上传一份 HTML 报告，开始建立你的资料库。</p>
            <button id="empty-action" class="secondary-button">清除筛选</button>
        </div>
    </main>

<dialog id="upload-modal" class="modal" aria-labelledby="upload-heading">
<div class="modal-content"><div class="modal-header"><div><h2 id="upload-heading">上传报告</h2><p class="hint">将 HTML 文件归档到你的报告库</p></div><button type="button" class="modal-close" aria-label="关闭上传窗口">×</button></div>
<form id="upload-form">
<label id="drop-zone" class="drop-zone" for="file-input"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3 M7 8l5-5 5 5 M4 15v5h16v-5"/></svg><span class="drop-text">拖拽 HTML 文件到此处，或点击选择</span><span class="hint">支持 .html 和 .htm 文件</span><input type="file" id="file-input" accept=".html,.htm" required aria-label="选择 HTML 报告"></label>
<div class="upload-fields"><label for="upload-title">报告标题 <span class="hint">可选，留空自动提取</span></label><input type="text" id="upload-title" placeholder="为报告起一个清晰的标题"><label for="upload-category">分类</label><input type="text" id="upload-category" placeholder="例如 daily-report、research"><label for="upload-tags">标签</label><input type="text" id="upload-tags" placeholder="使用英文逗号分隔"><label for="upload-visibility">可见范围</label><select id="upload-visibility"><option value="private">私有 · 仅自己和管理员可见</option><option value="public">公开 · 所有人可见</option></select></div>
<p id="upload-error" class="form-error" role="alert" hidden></p><button type="submit" class="upload-submit primary-button">上传报告</button>
</form></div></dialog>
<dialog id="confirm-modal" class="modal modal-confirm" aria-labelledby="confirm-heading"><div class="modal-content"><h2 id="confirm-heading">删除报告</h2><p id="confirm-msg"></p><div class="confirm-actions"><button class="secondary-button" id="confirm-cancel">取消</button><button class="danger-button" id="confirm-ok">删除报告</button></div></div></dialog>
<div id="notice" class="notice" role="status" hidden></div>
<script src="/app.js"></script>
</body></html>
